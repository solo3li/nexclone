apiVersion: v1
kind: Service
metadata:
  name: local-frontend
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: local-frontend
  namespace: default
subsets:
  - addresses:
      - ip: 10.42.0.1
    ports:
      - port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: local-backend
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: local-backend
  namespace: default
subsets:
  - addresses:
      - ip: 10.42.0.1
    ports:
      - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: local-dev-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dev.169.58.204.169.nip.io
        - api.169.58.204.169.nip.io
      secretName: local-dev-tls
  rules:
    - host: dev.169.58.204.169.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: local-frontend
                port:
                  number: 3000
    - host: api.169.58.204.169.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: local-backend
                port:
                  number: 8080
