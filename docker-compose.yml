services:
  postgres:
    image: postgres:15
    container_name: nexclone-postgres
    environment:
      - POSTGRES_DB=nexclone_dev
      - POSTGRES_USER=nexclone
      - POSTGRES_PASSWORD=devpassword123!
    ports:
      - "5432:5432"
    networks:
      - nexclone_network
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: nexclone-minio
    ports:
      - "9001:9001"
      - "9002:9002"
    environment:
      - MINIO_ROOT_USER=devminioadmin
      - MINIO_ROOT_PASSWORD=devminiosecret123!
    command: server /data --address ":9001" --console-address ":9002"
    networks:
      - nexclone_network
    volumes:
      - miniodata:/data

  redis:
    image: redis:7
    container_name: nexclone-redis
    command: redis-server --requirepass "devredis123!"
    ports:
      - "6379:6379"
    networks:
      - nexclone_network
    volumes:
      - redisdata:/data

  traefik:
    image: traefik:v2.10
    container_name: nexclone-traefik
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexclone_network
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic/traefik-dynamic.yml:ro
      - traefik-certs:/letsencrypt

networks:
  nexclone_network:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  redisdata:
  traefik-certs:
