# ==============================================================
# values-dev.yaml — Local Development Overrides
# Usage:  helm upgrade --install nexclone-dev ./nexclone-chart \
#           -n nexclone-dev --create-namespace \
#           -f nexclone-chart/values-dev.yaml
# ==============================================================

# Override bitnami sub-chart image registries to use official Docker images
# (bitnami images need Docker Hub auth for specific versioned tags)
global:
  imageRegistry: ""
  security:
    allowInsecureImages: true  # required to use non-bitnami images in bitnami charts

namespace: nexclone-dev

# ── Images: use locally built images (no registry pull) ───────
backend:
  image:
    repository: nexclone-backend
    tag: latest
    pullPolicy: Never          # use local docker build only
  replicaCount: 1
  aspnetEnvironment: Development
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1500m"
      memory: "1.5Gi"

frontend:
  image:
    repository: nexclone-frontend
    tag: latest
    pullPolicy: Never
  replicaCount: 1

# ── Ingress: nip.io hostnames, Let's Encrypt staging ──────────
ingress:
  enabled: true
  ingressClass: traefik
  tls: true
  certIssuer: letsencrypt-prod
  hosts:
    frontend: nexclone-dev.169.58.204.169.nip.io
    backend:  api-nexclone-dev.169.58.204.169.nip.io

# ── Secret name (will be created from .dev.env) ───────────────
envSecretName: nexclone-dev-env

# ── PostgreSQL — use official postgres:15-alpine (already in k3s) ────────────
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: "15-alpine"
  auth:
    username: nexclone
    password: devpassword123!
    database: nexclone_dev
  primary:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# ── Redis — use official redis:7-alpine (already in k3s) ─────────────────────
redis:
  enabled: true
  image:
    registry: docker.io
    repository: library/redis
    tag: "7-alpine"
  architecture: standalone
  auth:
    enabled: true
    password: devredis123!
  master:
    persistence:
      enabled: true
      size: 512Mi
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# ── MinIO — use official minio/minio image ───────────────────────────────────
minio:
  enabled: true
  image:
    registry: docker.io
    repository: minio/minio
    tag: "latest"
  auth:
    rootUser: devminioadmin
    rootPassword: devminiosecret123!
  defaultBuckets: "nexmedia-dev"
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001
