{{/* ============================================================
  ingress.yaml — Traefik Ingress for frontend + backend
  ============================================================ */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexclone-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certIssuer | quote }}
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
    # Force HTTPS redirect
    traefik.ingress.kubernetes.io/router.middlewares: nexclone-dev-redirect-https@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.ingressClass }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.backend }}
        - {{ .Values.ingress.hosts.frontend }}
      secretName: nexclone-dev-tls
  {{- end }}
  rules:
    # ── Backend API ────────────────────────────────────────────
    - host: {{ .Values.ingress.hosts.backend }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexclone-backend
                port:
                  number: {{ .Values.backend.port }}
    # ── Frontend App ───────────────────────────────────────────
    - host: {{ .Values.ingress.hosts.frontend }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexclone-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
