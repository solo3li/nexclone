{{/* ============================================================
  frontend.yaml — Deployment + Service for Next.js frontend
  ============================================================ */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexclone-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: nexclone-frontend
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: nexclone-frontend
  template:
    metadata:
      labels:
        app: nexclone-frontend
    spec:
      # Wait for backend to be up before starting frontend
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for backend..."
              until nc -z nexclone-backend {{ .Values.backend.port }}; do
                echo "Backend not ready yet, sleeping 3s..."
                sleep 3
              done
              echo "Backend is ready!"
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
              name: http
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "{{ .Values.frontend.port }}"
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nexclone-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: nexclone-frontend
spec:
  type: ClusterIP
  selector:
    app: nexclone-frontend
  ports:
    - protocol: TCP
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      name: http
