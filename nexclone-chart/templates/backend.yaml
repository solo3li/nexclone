{{/* ============================================================
  backend.yaml — Deployment + Service for ASP.NET Core backend
  ============================================================ */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexclone-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: nexclone-backend
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: nexclone-backend
  template:
    metadata:
      labels:
        app: nexclone-backend
    spec:
      # Init container: wait for PostgreSQL to be ready before starting backend
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z {{ .Release.Name }}-postgresql 5432; do
                echo "PostgreSQL not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until nc -z {{ .Release.Name }}-redis-master 6379; do
                echo "Redis not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              name: http
          # Load all env vars from the secret created from .dev.env
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.backend.port }}"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: dataprotection-keys
              mountPath: /app/dataprotection-keys
      volumes:
        - name: dataprotection-keys
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexclone-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: nexclone-backend
spec:
  type: ClusterIP
  selector:
    app: nexclone-backend
  ports:
    - protocol: TCP
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      name: http
