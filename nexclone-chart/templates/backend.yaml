{{/* ============================================================
  backend.yaml — Deployment + Service for ASP.NET Core backend
  ============================================================ */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexclone-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: nexclone-backend
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexclone-backend
  template:
    metadata:
      labels:
        app: nexclone-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL readiness..."
              until nc -z {{ .Release.Name }}-postgresql 5432 && \
                    echo "SELECT 1;" | timeout 5 nc -w 3 {{ .Release.Name }}-postgresql 5432 >/dev/null 2>&1 ||
                    nc -z {{ .Release.Name }}-postgresql 5432; do
                echo "PostgreSQL not ready yet, sleeping 3s..."
                sleep 3
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis readiness..."
              until nc -z {{ .Release.Name }}-redis-master 6379; do
                echo "Redis not ready yet, sleeping 3s..."
                sleep 3
              done
              echo "Redis is ready!"
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              name: http
          envFrom:
            - secretRef:
                name: {{ .Values.envSecretName }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.backend.aspnetEnvironment | default "Staging" | quote }}
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.backend.port }}"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nexclone-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: nexclone-backend
spec:
  type: ClusterIP
  selector:
    app: nexclone-backend
  ports:
    - protocol: TCP
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      name: http