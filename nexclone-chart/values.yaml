# ==============================================================
# NexClone Helm Chart – values.yaml (base / production defaults)
# For local dev, override with: -f values-dev.yaml
# ==============================================================

# ── Namespace ──────────────────────────────────────────────────
namespace: nexclone

# ── Image Registry ─────────────────────────────────────────────
# In production, override with your real registry path.
# In local dev, imagePullPolicy: Never (uses locally built images).
backend:
  image:
    repository: soloc/nexclone-backend
    tag: "" # Must be set to a specific version tag at deploy time
    pullPolicy: Always
  replicaCount: 1
  port: 8080
  aspnetEnvironment: Staging
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10

frontend:
  image:
    repository: soloc/nexclone-frontend
    tag: "" # Must be set to a specific version tag at deploy time
    pullPolicy: Always
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ── Ingress (Traefik) ──────────────────────────────────────────
ingress:
  enabled: true
  ingressClass: traefik
  # TLS via cert-manager. Set to false for HTTP-only local dev.
  tls: true
  certIssuer: letsencrypt-prod    # letsencrypt-prod = browser-trusted certs
  hosts:
    frontend: nexclone-dev.167.71.66.188.nip.io
    backend:  api-nexclone-dev.167.71.66.188.nip.io

# ── Secret name (created by secret.yaml from .dev.env) ─────────
envSecretName: nexclone-env

# ── Sub-chart: PostgreSQL ──────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: nexclone
    password: "" # Set via K8s secret - NEVER hardcode passwords here
    database: nexclone_dev
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"

# ── Sub-chart: Redis ───────────────────────────────────────────
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: "" # Set via K8s secret - NEVER hardcode passwords here
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"

# ── Sub-chart: MinIO ───────────────────────────────────────────
minio:
  enabled: true
  auth:
    rootUser: devminioadmin
    rootPassword: "" # Set via K8s secret - NEVER hardcode passwords here
  defaultBuckets: "nexmedia-dev"
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
  service:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001
