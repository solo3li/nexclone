version: '3.8'

services:
  # Traefik Reverse Proxy (Handles HTTPS and Routing)
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-admin@nexclone.com}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/letsencrypt"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-nexclone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nexclone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`s3.${DOMAIN}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=myresolver"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"

  backend:
    image: ${DOCKERHUB_USERNAME}/nexclone-backend:${IMAGE_TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-nexclone};Username=${DB_USER:-nexclone};Password=${DB_PASSWORD:-postgres}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:-redis}
      - Minio__Endpoint=minio:9000
      - Minio__PublicEndpoint=s3.${DOMAIN}
      - Minio__AccessKey=${MINIO_ROOT_USER:-admin}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD:-password123}
      - Minio__UseSSL=false
      - Minio__PublicUseSSL=true
      - MINIO_BROWSER_REDIRECT_URL=https://s3.${DOMAIN}
      - Jwt__Key=${JWT_KEY:-super_secret_key_change_me_in_production}
      - Jwt__Issuer=${JWT_ISSUER:-nexclone}
      - Jwt__Audience=${JWT_AUDIENCE:-nexclone_users}
      # Additional settings can be provided via .env file
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  frontend:
    image: ${DOCKERHUB_USERNAME}/nexclone-frontend:${IMAGE_TAG:-latest}
    environment:
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN}/api
      - NEXT_PUBLIC_SIGNALR_URL=https://api.${DOMAIN}
    env_file:
      - .env
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`uggu.space`) || Host(`www.uggu.space`) || Host(`${PROD_FRONTEND_DOMAIN:-$DOMAIN}`) || Host(`www.${PROD_FRONTEND_DOMAIN:-$DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  traefik_certs:
  postgres_data:
  redis_data:
  minio_data:
