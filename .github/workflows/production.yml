name: Production Pipeline

on:
  push:
    branches:
      - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./NexClone.Backend
          file: ./NexClone.Backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nexclone-backend:production
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexclone-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexclone-backend:buildcache,mode=max

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nexclone-frontend:production
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexclone-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nexclone-frontend:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.prod.${{ secrets.VPS_HOST }}.nip.io

  deploy-to-helm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS with Helm
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.PRODUCTION_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: ENV_FILE_CONTENT
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd /root/nexmedia/nexclone/nexclone-chart
            
            # Ensure namespace exists
            kubectl create namespace nexclone-production --dry-run=client -o yaml | kubectl apply -f -
            
            # Apply environment secrets securely
            echo "$ENV_FILE_CONTENT" > .prod.env
            kubectl create secret generic nexclone-env --from-env-file=.prod.env -n nexclone-production --dry-run=client -o yaml | kubectl apply -f -
            rm -f .prod.env
            
            helm upgrade --install nexclone-production . \
              --namespace nexclone-production \
              --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/nexclone-backend \
              --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/nexclone-frontend \
              --set backend.image.tag=production \
              --set frontend.image.tag=production \
              --set ingress.hosts.frontend=${{ vars.PROD_FRONTEND_DOMAIN }} \
              --set ingress.hosts.backend=api.prod.${{ secrets.VPS_HOST }}.nip.io \
              --set postgresql.enabled=true \
              --set redis.enabled=true \
              --set minio.enabled=true
